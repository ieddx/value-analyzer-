[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-analyzer"
version = "0.1.0"
description = "Deep value-investing analysis CLI (educational use only)"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.6",
    "rich>=13.7",
    "pyarrow>=14.0",
    "anthropic>=0.105.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
backtest = ["scipy>=1.12"]   # enables p-values in backtest t-tests

[project.scripts]
value-analyzer = "value_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call real external APIs (require internet, results are cached)",
]
